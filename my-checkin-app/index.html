<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>
    ระบบเช็กอินกิจกรรม | สภานักเรียน
  </title>


  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    @import url(
      'https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap'
    );

    body {
      font-family: 'Prompt', sans-serif;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body
  class="
    bg-gradient-to-br
    from-slate-900
    via-blue-950
    to-indigo-900
    min-h-screen
    flex
    items-center
    justify-center
    p-4
  "
>


  <div
    class="
      bg-white/95
      backdrop-blur-md
      rounded-3xl
      shadow-2xl
      p-6
      sm:p-8
      w-full
      max-w-md
    "
  >


    <!-- HEADER -->

    <div
      class="
        text-center
        mb-6
      "
    >

      <div
        class="
          inline-flex
          p-3
          bg-blue-50
          rounded-2xl
          shadow-inner
          mb-3
          border
          border-blue-100
        "
      >

        <svg
          class="
            w-14
            h-14
            text-blue-900
          "
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="
              M12 14
              l9-5
              -9-5
              -9 5
              9 5z
            "
          />

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="
              M12 14
              l6.16-3.422
              a12.083 12.083 0 01.665 6.479
              A11.952 11.952 0 0012 20.055
              a11.952 11.952 0 00-6.824-2.998
              a12.078 12.078 0 01.665-6.479
              L12 14z
            "
          />

        </svg>

      </div>


      <h1
        class="
          text-2xl
          font-bold
          text-slate-800
        "
      >
        ระบบเช็กอินกิจกรรม
      </h1>


      <p
        class="
          text-xs
          text-slate-500
          mt-1
          uppercase
          tracking-wider
        "
      >
        Student Council Check-in System
      </p>

    </div>


    <!-- LOGIN -->

    <div
      id="loginSection"
      class="space-y-4"
    >


      <div
        class="
          grid
          grid-cols-2
          gap-3
        "
      >

        <div>

          <label
            class="
              block
              text-xs
              font-semibold
              text-slate-600
              mb-1
            "
          >
            ระดับชั้น
          </label>


          <select
            id="gradeInput"
            class="
              w-full
              border
              border-slate-200
              rounded-xl
              p-3
              bg-slate-50
              text-sm
              outline-none
            "
          >

            <option value="ม.1">ม.1</option>
            <option value="ม.2">ม.2</option>
            <option value="ม.3">ม.3</option>
            <option value="ม.4">ม.4</option>
            <option value="ม.5">ม.5</option>
            <option value="ม.6">ม.6</option>

          </select>

        </div>


        <div>

          <label
            class="
              block
              text-xs
              font-semibold
              text-slate-600
              mb-1
            "
          >
            ห้อง
          </label>


          <input
            type="number"
            id="roomInput"
            min="1"
            placeholder="เช่น 1"
            class="
              w-full
              border
              border-slate-200
              rounded-xl
              p-3
              bg-slate-50
              text-sm
              outline-none
            "
          >

        </div>

      </div>


      <div>

        <label
          class="
            block
            text-xs
            font-semibold
            text-slate-600
            mb-1
          "
        >
          รหัสประจำตัวนักเรียน
        </label>


        <input
          type="text"
          id="studentIdInput"
          placeholder="กรอกรหัสนักเรียน"
          autocomplete="off"
          class="
            w-full
            border
            border-slate-200
            rounded-xl
            p-3
            bg-slate-50
            text-sm
            outline-none
          "
        >

      </div>


      <div
        class="
          grid
          grid-cols-3
          gap-2
        "
      >

        <div>

          <label
            class="
              block
              text-xs
              font-semibold
              text-slate-600
              mb-1
            "
          >
            คำนำหน้า
          </label>


          <input
            type="text"
            id="prefixInput"
            placeholder="นาย/น.ส."
            autocomplete="off"
            class="
              w-full
              border
              border-slate-200
              rounded-xl
              p-3
              bg-slate-50
              text-sm
              outline-none
            "
          >

        </div>


        <div
          class="
            col-span-2
          "
        >

          <label
            class="
              block
              text-xs
              font-semibold
              text-slate-600
              mb-1
            "
          >
            ชื่อ
          </label>


          <!--
            ถ้ามีชื่อกลาง ให้พิมพ์รวมในช่องนี้
            ตัวอย่าง:
            "อิทธิพล กลาง"
          -->

          <input
            type="text"
            id="firstNameInput"
            placeholder="ชื่อ / ชื่อกลาง"
            autocomplete="off"
            class="
              w-full
              border
              border-slate-200
              rounded-xl
              p-3
              bg-slate-50
              text-sm
              outline-none
            "
          >

        </div>

      </div>


      <div>

        <label
          class="
            block
            text-xs
            font-semibold
            text-slate-600
            mb-1
          "
        >
          นามสกุล
        </label>


        <input
          type="text"
          id="lastNameInput"
          placeholder="นามสกุล"
          autocomplete="off"
          class="
            w-full
            border
            border-slate-200
            rounded-xl
            p-3
            bg-slate-50
            text-sm
            outline-none
          "
        >

      </div>


      <div>

        <label
          class="
            block
            text-xs
            font-semibold
            text-slate-600
            mb-1
          "
        >
          เลขที่
        </label>


        <input
          type="number"
          id="studentNoInput"
          min="1"
          placeholder="เลขที่"
          autocomplete="off"
          class="
            w-full
            border
            border-slate-200
            rounded-xl
            p-3
            bg-slate-50
            text-sm
            outline-none
          "
        >

      </div>


      <button
        id="loginBtn"
        onclick="login()"
        class="
          w-full
          bg-blue-900
          hover:bg-blue-800
          text-white
          font-semibold
          py-3.5
          rounded-xl
          shadow-lg
          transition
        "
      >
        เข้าสู่ระบบ
      </button>

    </div>


    <!-- DASHBOARD -->

    <div
      id="dashboardSection"
      class="
        hidden
        space-y-4
      "
    >


      <div
        class="
          text-center
          bg-blue-50/50
          p-3.5
          rounded-2xl
          border
          border-blue-100
        "
      >

        <h3
          id="studentNameText"
          class="
            text-base
            font-bold
            text-slate-800
          "
        ></h3>


        <p
          id="studentDetailText"
          class="
            text-xs
            text-slate-600
            mt-0.5
          "
        ></p>

      </div>


      <div>

        <label
          class="
            block
            text-xs
            font-semibold
            text-slate-700
            mb-1
          "
        >
          รหัสกิจกรรม
        </label>


        <input
          type="text"
          id="activityCodeInput"
          placeholder="เช่น SM01"
          autocomplete="off"
          class="
            w-full
            border-2
            border-slate-200
            rounded-xl
            p-3
            text-center
            uppercase
            tracking-widest
            text-lg
            font-bold
            bg-slate-50
            outline-none
          "
        >

      </div>


      <button
        id="checkinBtn"
        onclick="submitCheckin()"
        class="
          w-full
          bg-emerald-600
          hover:bg-emerald-700
          text-white
          py-3.5
          rounded-xl
          font-bold
          text-base
          shadow-lg
        "
      >
        📍 ยืนยันเช็กอินกิจกรรม
      </button>


      <div
        class="
          border-t
          border-slate-100
          pt-3
        "
      >

        <div
          class="
            flex
            justify-between
            items-center
            mb-2
          "
        >

          <h4
            class="
              text-xs
              font-bold
              text-slate-700
            "
          >
            สถานะและประวัติกิจกรรม
          </h4>


          <button
            onclick="loadStudentActivities()"
            class="
              text-xs
              text-blue-600
              font-medium
            "
          >
            🔄 รีเฟรช
          </button>

        </div>


        <div
          id="activityListContainer"
          class="
            space-y-2
            max-h-56
            overflow-y-auto
          "
        ></div>

      </div>

    </div>

  </div>


  <!-- ไม่มี Firebase -->

  <script src="app.js"></script>

</body>

</html>
